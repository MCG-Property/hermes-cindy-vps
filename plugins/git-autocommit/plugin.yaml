name: git-autocommit
version: "2.0.0"
description: >-
  Wakes hermes-sync (scripts/hermes_sync.py) whenever a Hermes session finalizes or an agent job
  completes. hermes-sync commits meaningful changes, merges upstream NousResearch/hermes-agent into the
  carried branch (verified, never forced) and pushes to the remote main branch. Non-blocking: the sync
  runs detached and any failure is logged, never raised.
author: "Cam Douglas"
hooks:
  - on_session_finalize
